[package]
name = "opencode-config"
version = "0.6.1"
edition = "2021"
description = "Single-binary installer for an OpenRouter-based OpenCode setup with quota fallback"
license = "MIT"
repository = "https://github.com/Praveensenpai/opencode-config"
publish = false

[[bin]]
name = "opencode-config"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
