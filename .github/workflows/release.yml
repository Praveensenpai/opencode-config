name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package tarball
        run: |
          cd target/release
          tar -czf opencode-config-x86_64-unknown-linux-gnu.tar.gz opencode-config

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/opencode-config-x86_64-unknown-linux-gnu.tar.gz
          generate_release_notes: true
